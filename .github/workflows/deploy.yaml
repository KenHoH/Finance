name: Build and Deploy Frontend and Backend

on:
  push:
    branches: ["ken/dev"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          ref: ken/dev

      - name: Login to dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push to dockerhub
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: kenhoh/backend-dev:latest

      - name: Build and push to dockerhub
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: kenhoh/frontend-dev:latest
  deploy:
    needs: build
    name: Deploy image on OCI compute instance
    runs-on: ubuntu-latest

    steps:
      - name: install ssh keys
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} > ~/.ssh/known_hosts
      - name: connect and pull
        run: ssh centos@${{ secrets.SSH_HOST }} "cd ${{ secrets.WORK_DIR }} && docker compose down backend-app && docker compose pull && docker compose up backend-app -d && exit"
      - name: cleanup
        run: rm -rf ~/.ssh
